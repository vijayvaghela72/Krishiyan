name: krishiyan
description: "Krishiyan APP by Vijay Vaghela"
publish_to: 'none'

version: 1.3.0+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  otp_text_field:
  http: ^1.3.0
  intl: ^0.20.2
  crypto: ^3.0.6
  oauth2: ^2.0.3
  provider: ^6.1.5
  fl_chart: ^1.0.0
  chip_list: ^3.1.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  in_app_update: ^4.2.3
  path_provider: ^2.1.5
  fluttertoast: ^8.2.12
  dots_indicator: ^4.0.1
  flutter_spinkit: ^5.2.1
  page_transition: ^2.2.1
  dropdown_button2: ^2.3.9
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  app_version_update: ^6.1.3
  flutter_easyloading: ^3.0.5
  permission_handler: ^12.0.0+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - lib/lang/

  fonts:
    - family: arvo
      fonts:
        - asset: assets/fonts/arvo-regular.ttf
    - family: poppins-medium
      fonts:
        - asset: assets/fonts/poppins-medium.ttf
    - family: poppins-semibold
      fonts:
        - asset: assets/fonts/poppins-semibold.ttf
    - family: poppins-regular
      fonts:
        - asset: assets/fonts/poppins-regular.ttf
